<svg xmlns="http://www.w3.org/2000/svg" width="880" height="80" viewBox="0 0 880 80" role="img" aria-labelledby="t d">
<title id="t">A domain knowledge base in internal Git</title>
<desc id="d">A domain knowledge base in internal Git. Used as agent context in code review: business rules leave the heads of whoever remembers them and get checked in the PR.</desc>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:15px}
.dim{fill:#8b949e}.gr{fill:#39d353}.mid{fill:#2ea043}.fg{fill:#c9d1d9}.wh{fill:#f0f6fc}
.bl{fill:#58a6ff}.pu{fill:#d2a8ff}.or{fill:#ffa657}
@keyframes fadein{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.ln{animation:fadein .35s ease-out both}
.cursor{animation:blink 1.05s step-end infinite}
.dot{animation:pulse 2s ease-in-out infinite}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse" x="0"><path d="M40 0H0V40" fill="none" stroke="#c9d1d9" stroke-opacity=".025"/></pattern>
<linearGradient id="hl" x1="0" x2="1"><stop offset="0" stop-color="#39d353"/><stop offset="1" stop-color="#39d353" stop-opacity="0"/></linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="g" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="3.5"/></filter>

</defs>
<path d="M16 -40V120M864 -40V120" fill="none" stroke="#39d353" stroke-width="3" opacity=".12" filter="url(#glow)"/>
<rect x="16" y="0" width="848" height="80" fill="#0d1117"/>
<rect x="16" y="0" width="848" height="80" fill="url(#grid)"/>
<g class="ln" style="animation-delay:0.10s">
<text x="52" y="16" class="gr" style="font-size:13px">0x01</text>
<text x="108" y="16" font-weight="700" class="wh">A domain knowledge base in internal Git</text>
<text x="108" y="39" class="fg" fill-opacity=".85" style="font-size:14px">Used as agent context in code review: business rules leave the heads of</text><text x="108" y="60" class="fg" fill-opacity=".85" style="font-size:14px">whoever remembers them and get checked in the PR.</text>
<text x="828" y="16" text-anchor="end" class="bl" style="font-size:13px">open ↗</text>
<line x1="52" y1="79" x2="828" y2="79" stroke="#30363d" stroke-dasharray="2 4"/>
</g>
<path d="M16 0V80M864 0V80" fill="none" stroke="#30363d" stroke-width="1.2"/>
<g fill="none" stroke="#39d353" stroke-width="2"></g>
</svg>
