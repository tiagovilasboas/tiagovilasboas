<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" viewBox="0 0 880 560" role="img" aria-labelledby="t d">
<title id="t">Downshift</title>
<desc id="d">Downshift: Protect your coding agent&#39;s context window and route subagents to the right model tier. No LLM in the loop. A single Go binary in your coding agent&#39;s hooks. It compacts verbose command output before it pollutes the context, and applies the model and effort the orchestrator chose for each subagent within a policy you declare. Any doubt or error leaves the command untouched.</desc>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:15px}
.dim{fill:#3a8a4c}.gr{fill:#00ff41}.mid{fill:#00b82e}.fg{fill:#a8f5b8}.wh{fill:#e4ffe9}
@keyframes fadein{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.ln{animation:fadein .35s ease-out both}
.cursor{animation:blink 1.05s step-end infinite}
.dot{animation:pulse 2s ease-in-out infinite}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse" x="0"><path d="M40 0H0V40" fill="none" stroke="#00ff41" stroke-opacity=".045"/></pattern>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" fill-opacity=".22"/></pattern>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="g" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="3.5"/></filter>

</defs>
<path d="M16 -40V600M864 -40V600" fill="none" stroke="#00ff41" stroke-width="3" opacity=".4" filter="url(#glow)"/>
<rect x="16" y="0" width="848" height="560" fill="#010803"/>
<rect x="16" y="0" width="848" height="560" fill="url(#grid)"/>
<text x="52" y="44" font-weight="700" fill="#00ff41" filter="url(#g)" opacity=".6" style="font-size:20px">~/</text>
<text x="52" y="44" font-weight="700" style="font-size:20px"><tspan class="gr">~/</tspan><tspan class="wh">building/downshift</tspan></text>
<text x="828" y="44" text-anchor="end" letter-spacing="2" class="dim" style="font-size:12px">★ 3 · v0.17.1  // 01</text>
<line x1="52" y1="58" x2="828" y2="58" stroke="#00ff41" stroke-opacity=".25"/>
<line x1="52" y1="58" x2="172" y2="58" stroke="#00ff41" stroke-width="2"/>
<line x1="52" y1="58" x2="172" y2="58" stroke="#00ff41" stroke-width="3" filter="url(#g)" opacity=".7"/>
<g class="ln" style="animation-delay:.2s"><text x="52" y="92" font-weight="700" class="wh" style="font-size:16px">Protect your coding agent&#39;s context window and route subagents to the right</text></g>
<g class="ln" style="animation-delay:.2s"><text x="52" y="116" font-weight="700" class="wh" style="font-size:16px">model tier. No LLM in the loop.</text></g>
<g class="ln" style="animation-delay:0.35s"><text x="52" y="144" class="fg" fill-opacity=".72" style="font-size:13px">A single Go binary in your coding agent&#39;s hooks. It compacts verbose command output before it</text></g>
<g class="ln" style="animation-delay:0.40s"><text x="52" y="163" class="fg" fill-opacity=".72" style="font-size:13px">pollutes the context, and applies the model and effort the orchestrator chose for each subagent</text></g>
<g class="ln" style="animation-delay:0.45s"><text x="52" y="182" class="fg" fill-opacity=".72" style="font-size:13px">within a policy you declare. Any doubt or error leaves the command untouched.</text></g>
<g class="ln" style="animation-delay:.5s">
<rect x="52" y="205" width="776" height="96" fill="#000" fill-opacity=".45" stroke="#00ff41" stroke-opacity=".3"/>
<text x="68" y="231" class="fg" style="font-size:13px">$ go test ./internal/...</text><text x="812" y="231" text-anchor="end" class="dim" style="font-size:12px"># ~4 KB to say everything passed</text>
<text x="68" y="253" class="gr" style="font-size:13px">Go test: PASS (53 packages ok, 4 without tests)</text><text x="812" y="253" text-anchor="end" class="dim" style="font-size:12px"># ~1 KB, same verdict</text>
<line x1="68" y1="267" x2="812" y2="267" stroke="#00ff41" stroke-opacity=".15"/>
<text x="68" y="287" style="font-size:12px"><tspan class="gr">$ </tspan><tspan class="wh">curl -fsSL https://raw.githubusercontent.com/tiagovilasboas/downshift-ai/main/install.sh | sh</tspan></text>
</g>
<g class="ln" style="animation-delay:0.78s"><text x="52" y="333" style="font-size:13px"><tspan class="gr">▸ compaction </tspan><tspan class="fg">shrinks clean output, keeps every failure, diff and stack trace verbatim</tspan></text></g>
<g class="ln" style="animation-delay:0.86s"><text x="52" y="355" style="font-size:13px"><tspan class="gr">▸ routing    </tspan><tspan class="fg">applies the orchestrator&#39;s model tier and effort within your policy.json</tspan></text></g>
<g class="ln" style="animation-delay:0.94s"><text x="52" y="377" style="font-size:13px"><tspan class="gr">▸ squad      </tspan><tspan class="fg">a 14-agent squad you trigger in plain language (downshift full-power)</tspan></text></g>
<g class="ln" style="animation-delay:1.02s"><text x="52" y="399" style="font-size:13px"><tspan class="gr">▸ cache-tax  </tspan><tspan class="fg">prices a cold prompt cache before you pay for it</tspan></text></g>
<g class="ln" style="animation-delay:1.1s"><rect x="52" y="423" width="149.6" height="24" fill="#0b3d17" fill-opacity=".35" stroke="#00ff41" stroke-opacity=".6"/><text x="62" y="439" style="font-size:12px"><tspan class="wh">Claude Code</tspan><tspan fill="#00ff41"> done</tspan></text><rect x="209.6" y="423" width="92" height="24" fill="#0b3d17" fill-opacity=".35" stroke="#00b82e" stroke-opacity=".6"/><text x="219.6" y="439" style="font-size:12px"><tspan class="wh">Codex</tspan><tspan fill="#00b82e"> ok</tspan></text><rect x="309.6" y="423" width="99.2" height="24" fill="#0b3d17" fill-opacity=".35" stroke="#00b82e" stroke-opacity=".6"/><text x="319.6" y="439" style="font-size:12px"><tspan class="wh">Cursor</tspan><tspan fill="#00b82e"> ok</tspan></text><rect x="416.8" y="423" width="135.2" height="24" fill="#0b3d17" fill-opacity=".35" stroke="#00b82e" stroke-opacity=".6"/><text x="426.8" y="439" style="font-size:12px"><tspan class="wh">Antigravity</tspan><tspan fill="#00b82e"> ok</tspan></text><rect x="560" y="423" width="128" height="24" fill="#0b3d17" fill-opacity=".35" stroke="#c8e05a" stroke-opacity=".6"/><text x="570" y="439" style="font-size:12px"><tspan class="wh">OpenCode</tspan><tspan fill="#c8e05a"> beta</tspan></text><rect x="696" y="423" width="120.8" height="24" fill="#0b3d17" fill-opacity=".35" stroke="#3a8a4c" stroke-opacity=".6"/><text x="706" y="439" style="font-size:12px"><tspan class="wh">KiroCrew</tspan><tspan fill="#3a8a4c"> exp</tspan></text></g>
<g class="ln" style="animation-delay:1.25s"><text x="52" y="481" class="dim" style="font-size:12px"><tspan class="gr">// </tspan>Synthetic corpus of 248 outputs: clean runs -82% bytes, whole corpus -72%. Everyday savings not</text></g>
<g class="ln" style="animation-delay:1.30s"><text x="52" y="499" class="dim" style="font-size:12px">   established yet. Tokens, never dollars.</text></g>
<rect x="16" y="0" width="848" height="560" fill="url(#scan)" pointer-events="none"/>
<path d="M16 0V560M864 0V560" fill="none" stroke="#00ff41" stroke-width="1.2"/>
<g fill="none" stroke="#00ff41" stroke-width="2"></g>
</svg>
