<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" role="img" aria-labelledby="t d">
<title id="t">Downshift</title>
<desc id="d">Downshift: Protect your coding agent&#39;s context window and route subagents to the right model tier. No LLM in the loop. Synthetic corpus: -72% bytes. Everyday savings not proven yet. Tokens, never dollars.</desc>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:15px}
.dim{fill:#8b949e}.gr{fill:#39d353}.mid{fill:#2ea043}.fg{fill:#c9d1d9}.wh{fill:#f0f6fc}
.bl{fill:#58a6ff}.pu{fill:#d2a8ff}.or{fill:#ffa657}
@keyframes fadein{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.ln{animation:fadein .35s ease-out both}
.cursor{animation:blink 1.05s step-end infinite}
.dot{animation:pulse 2s ease-in-out infinite}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse" x="0"><path d="M40 0H0V40" fill="none" stroke="#c9d1d9" stroke-opacity=".025"/></pattern>
<linearGradient id="hl" x1="0" x2="1"><stop offset="0" stop-color="#39d353"/><stop offset="1" stop-color="#39d353" stop-opacity="0"/></linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="g" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="3.5"/></filter>

</defs>
<path d="M16 -40V400M864 -40V400" fill="none" stroke="#39d353" stroke-width="3" opacity=".12" filter="url(#glow)"/>
<rect x="16" y="0" width="848" height="360" fill="#0d1117"/>
<rect x="16" y="0" width="848" height="360" fill="url(#grid)"/>
<rect x="36" y="16" width="808" height="44" rx="6" fill="#161b22" stroke="#30363d"/>
<text x="52" y="44" font-weight="700" style="font-size:20px"><tspan class="gr">01.</tspan><tspan class="dim"> // </tspan><tspan class="wh">building/downshift</tspan><tspan class="pu">()</tspan></text>
<rect class="cursor" x="384" y="28" width="10" height="20" fill="#39d353"/>
<rect x="406" y="37" width="283.79999999999995" height="2" fill="url(#hl)"/>
<text x="828" y="43" text-anchor="end" letter-spacing="2" class="dim" style="font-size:12px">★ 6 · v0.19.0</text>
<g class="ln" style="animation-delay:.2s"><text x="52" y="92" font-weight="700" class="wh" style="font-size:16px">Protect your coding agent&#39;s context window and route subagents to the right</text></g>
<g class="ln" style="animation-delay:.2s"><text x="52" y="116" font-weight="700" class="wh" style="font-size:16px">model tier. No LLM in the loop.</text></g>
<g class="ln" style="animation-delay:.5s">
<rect x="52" y="148" width="776" height="124" rx="6" fill="#0d1117" stroke="#30363d"/>
<path d="M52 176H828" stroke="#30363d"/>
<circle cx="68" cy="162" r="5" fill="#ff5f57"/><circle cx="84" cy="162" r="5" fill="#febc2e"/><circle cx="100" cy="162" r="5" fill="#39d353"/>
<text x="440" y="166" text-anchor="middle" class="dim" style="font-size:12px">downshift — zsh</text>
<text x="68" y="202" class="wh" style="font-size:14px">$ go test ./internal/...</text><text x="812" y="202" text-anchor="end" class="dim" style="font-size:13px"># ~4 KB to say everything passed</text>
<text x="68" y="224" class="gr" style="font-size:14px">Go test: PASS (53 packages ok, 4 without tests)</text><text x="812" y="224" text-anchor="end" class="dim" style="font-size:13px"># ~1 KB, same verdict</text>
<line x1="68" y1="238" x2="812" y2="238" stroke="#30363d"/>
<text x="68" y="258" style="font-size:13px"><tspan class="gr">$ </tspan><tspan class="bl">curl -fsSL https://raw.githubusercontent.com/tiagovilasboas/downshift-ai/main/install.sh | sh</tspan></text>
</g>
<g class="ln" style="animation-delay:0.85s"><text x="52" y="302" class="dim" style="font-size:13px"><tspan class="gr">// </tspan>Synthetic corpus: -72% bytes. Everyday savings not proven yet. Tokens, never dollars.</text></g>
<path d="M16 0V360M864 0V360" fill="none" stroke="#30363d" stroke-width="1.2"/>
<g fill="none" stroke="#39d353" stroke-width="2"></g>
</svg>
