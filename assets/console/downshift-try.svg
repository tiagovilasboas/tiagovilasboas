<svg xmlns="http://www.w3.org/2000/svg" width="220" height="80" viewBox="0 0 220 80" role="img" aria-labelledby="t d">
<title id="t">Try it</title>
<desc id="d">Try it: install in 1 line</desc>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:15px}
.dim{fill:#3a8a4c}.gr{fill:#00ff41}.mid{fill:#00b82e}.fg{fill:#a8f5b8}.wh{fill:#e4ffe9}
@keyframes fadein{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.ln{animation:fadein .35s ease-out both}
.cursor{animation:blink 1.05s step-end infinite}
.dot{animation:pulse 2s ease-in-out infinite}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse" x="-20"><path d="M40 0H0V40" fill="none" stroke="#00ff41" stroke-opacity=".045"/></pattern>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" fill-opacity=".22"/></pattern>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="g" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="3.5"/></filter>

</defs>

<rect x="0" y="0" width="220" height="80" fill="#010803"/>
<rect x="0" y="0" width="220" height="80" fill="url(#grid)"/>
<g class="ln" style="animation-delay:0.20s">
<rect x="8" y="14" width="204" height="52" fill="#0b3d17" fill-opacity=".4" stroke="#00ff41" stroke-opacity=".45"/>
<path d="M8 26V14H20M200 66H212V54" fill="none" stroke="#00ff41" stroke-width="2"/>
<text x="22" y="37" font-weight="700" class="wh"><tspan class="gr">[2]</tspan> Try it</text>
<text x="22" y="55" class="dim" style="font-size:11px">install in 1 line</text>
<text x="200" y="37" text-anchor="end" class="gr">↗</text>
</g>
<rect x="0" y="0" width="220" height="80" fill="url(#scan)" pointer-events="none"/>

<g fill="none" stroke="#00ff41" stroke-width="2"></g>
</svg>
