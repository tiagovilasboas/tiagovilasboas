<svg xmlns="http://www.w3.org/2000/svg" width="880" height="120" viewBox="0 0 880 120" role="img" aria-labelledby="t d">
<title id="t">contributions</title>
<desc id="d">Section: contributions</desc>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:15px}
.dim{fill:#8b949e}.gr{fill:#39d353}.mid{fill:#2ea043}.fg{fill:#c9d1d9}.wh{fill:#f0f6fc}
.bl{fill:#58a6ff}.pu{fill:#d2a8ff}.or{fill:#ffa657}
@keyframes fadein{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.ln{animation:fadein .35s ease-out both}
.cursor{animation:blink 1.05s step-end infinite}
.dot{animation:pulse 2s ease-in-out infinite}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse" x="0"><path d="M40 0H0V40" fill="none" stroke="#c9d1d9" stroke-opacity=".025"/></pattern>
<linearGradient id="hl" x1="0" x2="1"><stop offset="0" stop-color="#39d353"/><stop offset="1" stop-color="#39d353" stop-opacity="0"/></linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="g" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="3.5"/></filter>

</defs>
<path d="M16 -40V160M864 -40V160" fill="none" stroke="#39d353" stroke-width="3" opacity=".12" filter="url(#glow)"/>
<rect x="16" y="0" width="848" height="120" fill="#0d1117"/>
<rect x="16" y="0" width="848" height="120" fill="url(#grid)"/>
<rect x="36" y="16" width="808" height="44" rx="6" fill="#161b22" stroke="#30363d"/>
<text x="52" y="44" font-weight="700" style="font-size:20px"><tspan class="gr">04.</tspan><tspan class="dim"> // </tspan><tspan class="wh">contributions</tspan><tspan class="pu">()</tspan></text>
<rect class="cursor" x="324" y="28" width="10" height="20" fill="#39d353"/>
<rect x="346" y="37" width="482" height="2" fill="url(#hl)"/>

<g class="ln" style="animation-delay:.2s"><text x="52" y="96" class="dim"><tspan class="gr">$</tspan> gh pr list --author @me --state merged  # small, tested fixes to projects I use</text></g>
<path d="M16 0V120M864 0V120" fill="none" stroke="#30363d" stroke-width="1.2"/>
<g fill="none" stroke="#39d353" stroke-width="2"></g>
</svg>
