name: Metrics
on:
  schedule: [cron: "0 0 * * 0"]      # weekly
  workflow_dispatch:

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: tiagovilasboas
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/Sao_Paulo

      - name: Adjust PR count (include Bitbucket + Azure DevOps)
        run: |
          # Read current "X Pull requests opened" from SVG and add external PRs
          CURRENT=$(grep -oP '\d+(?= Pull requests opened)' github-metrics.svg || echo "0")
          TOTAL=$((CURRENT + 1000))
          sed -i "s/${CURRENT} Pull requests opened/${TOTAL} Pull requests opened/" github-metrics.svg

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add github-metrics.svg
          git diff --staged --quiet || git commit -m "chore: update metrics"
          git push