name: Render console

on:
  schedule:
    - cron: "17 8 * * *" # daily, 08:17 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/console/**
      - scripts/oss-block/contributions.md
      - .github/workflows/console.yml

permissions: {}

jobs:
  # Pull requests: offline unit tests only.
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Unit tests
        run: node --version && node --test scripts/console/console.test.mjs

  # Schedule / manual run on the default branch: fetch live data, render the SVGs and README, commit.
  # Removed slices are not deleted from the branch; unused SVGs are harmless.
  render:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: console-render
      cancel-in-progress: false
    env:
      WRITE: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Unit tests
        run: node --test scripts/console/console.test.mjs
      - name: Fetch GitHub data and render SVGs
        env:
          GH_TOKEN: ${{ github.token }} # public profile data only
          LOGIN: ${{ github.repository_owner }}
        run: |
          gh api graphql -f query="$(node scripts/console/render.mjs --print-query)" -F login="$LOGIN" \
            | node scripts/console/render.mjs
      - name: Commit if changed (signed by GitHub as github-actions[bot])
        if: env.WRITE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(README.md scripts/console/data/profile.json assets/console/*.svg)
          if git diff --quiet -- "${files[@]}"; then
            echo "Console unchanged; nothing to commit"
            exit 0
          fi
          additions=$(for f in "${files[@]}"; do
            jq -n --arg path "$f" --arg contents "$(base64 -w0 "$f")" '{path: $path, contents: $contents}'
          done | jq -s .)
          jq -n \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg branch "$GITHUB_REF_NAME" \
            --arg head "$(git rev-parse HEAD)" \
            --argjson additions "$additions" \
            '{query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { url } } }",
              variables: {input: {
                branch: {repositoryNameWithOwner: $repo, branchName: $branch},
                expectedHeadOid: $head,
                message: {headline: "chore(profile): refresh console stats"},
                fileChanges: {additions: $additions}}}}' \
            | gh api graphql --input - --jq '.data.createCommitOnBranch.commit.url'
